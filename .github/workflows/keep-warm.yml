name: Mantener backend despierto

# El plan gratuito de Render duerme el servicio tras ~15 min sin tráfico y el
# arranque en frío de Spring Boot puede tardar varios minutos. Por eso el ping
# espera hasta 4 min y reintenta una vez: con `-m 30` fallaba casi siempre y
# GitHub enviaba un correo por cada intento fallido.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Evita que dos pings se solapen si un arranque en frío tarda más de lo normal.
concurrency:
  group: keep-warm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Despertar y comprobar el backend
        run: |
          set -euo pipefail
          URL="https://logistech-b2b.onrender.com/api/health"
          echo "Ping a $URL"
          curl -fsS \
            --connect-timeout 20 \
            --max-time 240 \
            --retry 1 \
            --retry-delay 10 \
            --retry-all-errors \
            -w "\nOK: HTTP %{http_code} en %{time_total}s\n" \
            "$URL"
