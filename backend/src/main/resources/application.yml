spring:
  application:
    name: logistech-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/logistech}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Supabase JWT: se valida con el secret en SecurityConfig (modo simple para empezar)
          issuer-uri: ${SUPABASE_URL:https://xyzcompany.supabase.co}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

timefold:
  solver:
    termination:
      spent-limit: ${SOLVER_SPENT_LIMIT:10s}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  supabase:
    url: ${SUPABASE_URL:https://npswaigxcmyddqwdktge.supabase.co}
  osrm:
    base-url: ${OSRM_BASE_URL:https://router.project-osrm.org}

logging:
  level:
    com.logistech: DEBUG
