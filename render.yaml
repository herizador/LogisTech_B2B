services:
  - type: web
    name: logistech-b2b
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: jdbc:postgresql://db.TU-PROYECTO.supabase.co:5432/postgres
      - key: DATABASE_USER
        value: postgres
      - key: DATABASE_PASSWORD
        sync: false
      - key: SUPABASE_URL
        value: https://TU-PROYECTO.supabase.co
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://logistechb2b.vercel.app
      - key: JAVA_TOOL_OPTIONS
        value: -Xmx384m
